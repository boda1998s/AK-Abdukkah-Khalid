:root{
  color-scheme:dark;
  --bg:#26282A;--panel:#323437;--panel2:#3A3C3F;--line:#4B4E52;--text:#ECEBE8;--muted:#AEB0B3;
  --silver:#D7D8DA;--ink:#26282A;--ok:#9AD7AE;--danger:#F0A0A0;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
  --serif:"Cinzel",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.4}
body.lock-scroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--silver);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
.wrap{max-width:880px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:6px;min-height:48px}
.top .sp{flex:1}
.ib{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--silver);background:var(--panel)}
.ib:active{background:var(--panel2)}
.ib.plain{background:none}
.brand{display:flex;justify-content:center;margin:6px 0 4px}
.logo{width:min(74vw,290px);height:auto;color:var(--silver);display:block}
.month{font-family:var(--serif);letter-spacing:.28em;text-align:center;color:var(--muted);font-size:13px;margin:6px 0 18px;text-transform:uppercase}
.chip{display:block;margin:-10px auto 14px;font-size:12.5px;color:var(--muted);min-height:34px;padding:0 12px;border-radius:17px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.veil{display:block;text-align:left;color:inherit;min-height:44px;border-radius:12px;padding:2px 4px;margin:-2px -4px}
.veil .blurme{transition:filter .25s}
.veil.on .blurme{filter:blur(11px);user-select:none;-webkit-user-select:none}
.big{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:14px}
.total{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.btn{min-height:46px;padding:0 18px;border-radius:14px;background:var(--silver);color:var(--ink);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{opacity:.85}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.danger{background:none;color:var(--danger);border:1px solid #6b4a4a}
.btn.sm{min-height:40px;padding:0 14px;border-radius:12px;font-size:15px}
.btn.wide{width:100%}
.row{display:flex;gap:10px;align-items:center}
.row.wrap2{flex-wrap:wrap}
.mt{margin-top:14px}.mt2{margin-top:22px}
.timer{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:14px}
.tm{font-family:var(--serif);font-weight:700;font-size:40px;letter-spacing:.04em;font-variant-numeric:tabular-nums;line-height:1.1}
.tm.on{color:var(--ok)}
.timer .btn{min-width:130px}
details.sess{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.sess summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:36px;display:flex;align-items:center}
.sess li{display:flex;align-items:center;gap:8px;padding:6px 0;color:var(--text);font-size:14px;border-bottom:1px solid #3d4044}
.sess li span{flex:1}
ul.clean{list-style:none;margin:0;padding:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;gap:10px}
.sec-h h2{font-family:var(--serif);font-size:18px;letter-spacing:.18em;margin:0;text-transform:uppercase;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:12px;min-height:84px}
.tile:active{background:#43454a}
.av{width:60px;height:60px;border-radius:14px;background:var(--silver);color:var(--ink);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:22px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.tile .nm{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tx{min-width:0;flex:1}
.tile .amt{font-variant-numeric:tabular-nums;color:var(--silver);font-size:15px;margin-top:2px}
.tile.empty{border-style:dashed;color:var(--muted);justify-content:center}
/* client screen */
.chead{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.chead .nm{font-size:22px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stats .card{padding:14px}
.stats .v{font-family:var(--serif);font-weight:700;font-size:24px;margin:4px 0;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:#4a4d51;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
button.card{text-align:left;width:100%}
.cal-h,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-h span{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 0}
.cell{aspect-ratio:1/1;min-height:46px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums}
.cell.empty{background:none;border:0}
.cell .n{font-weight:600;font-size:16px}
.cell.today{border-color:var(--silver);box-shadow:inset 0 0 0 1px var(--silver)}
.cell:active{background:#43454a}
.ind{display:flex;gap:4px;align-items:center;height:12px}
.ind .d{width:7px;height:7px;border-radius:50%;background:var(--silver)}
.ind .p{font-size:11px;font-weight:800;line-height:1;color:var(--ink);background:var(--silver);border-radius:4px;padding:1px 3px}
.ind .ok{width:13px;height:13px;color:var(--ok);stroke-width:3.2}
.legend .ok{width:14px;height:14px;color:var(--ok);stroke-width:3.2;vertical-align:-2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:10px}
.open li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #3d4044;text-align:left;width:100%}
.open .dt{color:var(--muted);font-size:13px;min-width:54px}
/* sheets */
#sheet,#inv{position:fixed;inset:0;display:none}
#sheet{background:rgba(0,0,0,.6);z-index:30;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
.sheet{width:min(580px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:700px){#sheet{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid var(--line)}}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sh-h h3{margin:0;font-size:19px;flex:1;min-width:0}
.sh-h .ib{width:42px;height:42px;background:var(--panel2)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.choice{background:var(--panel2);border:1px solid var(--line);border-radius:18px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px}
.choice .ic{width:30px;height:30px}
.choice small{font-weight:500;color:var(--muted);font-size:13px}
.choice:active{background:#43454a}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;letter-spacing:.04em}
input[type=text],input[type=number],input[type=search],input[type=password],input:not([type]),select{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;color:var(--text)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat}
.inl{display:flex;gap:8px}
.inl input{flex:1;min-width:0}
ul.notes li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #404347}
ul.notes .t{flex:1;min-width:0;overflow-wrap:anywhere;font-size:16px}
ul.notes li.done .t{text-decoration:line-through;color:var(--muted)}
.chk{width:44px;height:44px;border-radius:12px;border:2px solid var(--silver);display:grid;place-items:center;color:transparent;flex:none}
.chk .ic{stroke-width:3.2}
li.done .chk{background:var(--ok);border-color:var(--ok);color:var(--ink)}
.xb{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.xb:active{background:var(--panel2)}
.empty-n{color:var(--muted);padding:10px 0}
.sum{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px}
.sum div{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
.sum .tt{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-weight:800;font-size:19px;color:var(--silver)}
.adds li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #404347}
.adds .t{flex:1;min-width:0;overflow-wrap:anywhere}
.adds .a{font-variant-numeric:tabular-nums;font-weight:700}
.adds .dd{color:var(--muted);font-size:13px}
.photo-row{display:flex;gap:14px;align-items:center}
.photo-row .av{width:76px;height:76px;border-radius:18px;font-size:28px}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
.sep{height:1px;background:var(--line);margin:18px 0}
/* history */
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;min-height:68px}
.mrow .mt1{font-weight:700}
.mrow .ar{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;color:var(--silver);text-align:right}
/* lock */
#lock{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#lock.on{display:flex}
#lock .logo{width:min(46vw,170px)}
.dots{display:flex;gap:14px;margin:6px 0 10px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--silver)}
.dots i.f{background:var(--silver)}
.dots.bad{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pad button{height:68px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:26px;font-family:var(--serif);font-weight:600}
.pad button:active{background:var(--panel2)}
.pad .ghost{background:none;border:0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--silver);color:var(--ink);padding:11px 18px;border-radius:12px;font-weight:600;z-index:80;display:none;max-width:90vw}
/* invoice overlay */
#inv{background:#585b60;z-index:50;overflow:auto;-webkit-overflow-scrolling:touch}
#inv.on{display:block}
.inv-bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:max(10px,env(safe-area-inset-top)) 12px 10px;flex-wrap:wrap}
.inv-bar label{display:flex;gap:8px;align-items:center;font-size:14px;min-height:40px}
.inv-bar input[type=checkbox]{width:20px;height:20px;accent-color:#D7D8DA}
.doc{background:#fff;color:#1d1f21;width:min(794px,calc(100% - 20px));margin:16px auto 40px;padding:44px 44px 36px;box-shadow:0 8px 40px rgba(0,0,0,.4);font-family:var(--sans);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.d-logo{width:190px;height:auto;color:#3A3C3F}
.d-title{text-align:right}
.d-title h1{font-family:var(--serif);letter-spacing:.3em;margin:0;font-size:26px;color:#3A3C3F}
.d-title p{margin:4px 0 0;color:#5d6064;font-size:13px}
.d-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 0 22px;padding:14px 0;border-top:2px solid #3A3C3F;border-bottom:1px solid #d7d8da}
.d-meta small{display:block;font-size:11px;letter-spacing:.14em;color:#6a6d71;text-transform:uppercase}
.d-meta b{font-size:16px}
.doc table{width:100%;border-collapse:collapse;font-size:14px}
.doc th{text-align:left;background:#3A3C3F;color:#fff;font-weight:600;padding:9px 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.doc td{padding:9px 10px;border-bottom:1px solid #e3e4e6;vertical-align:top;overflow-wrap:anywhere}
.doc th.r,.doc td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc tr.tot td{border-bottom:0;border-top:2px solid #3A3C3F;font-weight:800;font-size:17px;padding-top:12px}
.doc h4{font-family:var(--serif);letter-spacing:.2em;margin:26px 0 8px;font-size:13px;color:#3A3C3F;text-transform:uppercase}
.log li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid #eceded;font-size:14px}
.log .m{width:18px;flex:none;font-weight:800}
.log .dd{color:#6a6d71;min-width:48px;flex:none}
.log li.pend{color:#6a6d71}
.d-foot{margin-top:34px;padding-top:12px;border-top:1px solid #d7d8da;text-align:center;font-size:12px;letter-spacing:.16em;color:#6a6d71;text-transform:uppercase}
@media(max-width:560px){.doc{padding:24px 18px}.d-meta{grid-template-columns:1fr 1fr}.d-title{text-align:left}}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  #app,#sheet,#lock,#toast,.inv-bar{display:none!important}
  #inv{position:static!important;display:block!important;background:#fff!important;overflow:visible!important}
  .doc{box-shadow:none!important;margin:0!important;width:auto!important;padding:0!important}
  @page{size:A4;margin:14mm}
}
</style>
</head>

<div id="app"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="inv"></div>
<div id="lock" role="dialog" aria-label="Enter PIN"></div>
<div id="toast" role="status"></div>

  return D.sessions.length > 0 || Object.keys(D.cur).some(id => { const x = D.cur[id]; return x.adds.length || Object.keys(x.notes).length; });
}
function archiveCurrent() {
  const s = snapshot(D.month);
  D.archive.unshift(s);
  D.cur = {}; D.sessions = [];
  return s;
}
function checkMonth() {
  const cm = monthKey(new Date());
  if (cm === D.month) return false;
  const old = D.month;
  const boundary = new Date(+old.slice(0, 4), +old.slice(5, 7), 1).getTime();
  if (D.timer.running && D.timer.startedAt < boundary) D.sessions.push({ id: uid(), start: D.timer.startedAt, end: boundary });
  const skip = D.manualClosed === old && !hasActivity();
  if (D.clients.length && !skip) { archiveCurrent(); D.pending = old; }
  else { D.cur = {}; D.sessions = []; }
  if (D.timer.running) { const now = new Date(); D.timer.startedAt = new Date(now.getFullYear(), now.getMonth(), 1).getTime(); }
  D.month = cm; D.manualClosed = null;
  save(); return true;
}

  return `${monoSvg("logo")}<div class="lbl">Enter PIN</div><div class="dots" id="dots">${dots}</div><div class="pad">${keys}</div>`;

function pinKey(k) {
  if (k === "⌫") U.pinBuf = U.pinBuf.slice(0, -1);
  else if (U.pinBuf.length < D.pin.length) U.pinBuf += k;
  if (U.pinBuf.length === D.pin.length) {
    if (U.pinBuf === D.pin) { sessionStorage.setItem("ak_unlocked", "1"); U.locked = false; U.pinBuf = ""; render(); return; }
    const dEl = $("#dots"); dEl.classList.add("bad"); U.pinBuf = "";

}

/* ---------- actions ---------- */
function resizeImage(file, size = 256) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(img.width, img.height), sx = (img.width - s) / 2, sy = (img.height - s) / 2;
      const c = document.createElement("canvas"); c.width = c.height = size;
      c.getContext("2d").drawImage(img, sx, sy, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });

async function doExport() {

function doImport(file) {

}
function onSubmit(e) {
  const f = e.target.dataset && e.target.dataset.form; if (!f) return;
  e.preventDefault();
  const fd = new FormData(e.target);

    const n = cd(U.cid).notes; (n[U.sheet.day] = n[U.sheet.day] || []).push({ id: uid(), text: t, done: false });
    save(); U.focus = "#noteIn"; render();
  } else if (f === "add") {
    const t = String(fd.get("t") || "").trim(), a = num(fd.get("a")); if (!t || !a) { toast("Enter a title and an amount"); return; }
    cd(U.cid).adds.push({ id: uid(), day: U.sheet.day || dayKey(new Date()), title: t, amount: a });
    save(); U.focus = "#addT"; render();
  } else if (f === "client") {
    const name = String(fd.get("name") || "").trim(); if (!name) return;
    const base = num(fd.get("base"));
    if (U.sheet.id) { const c = getClient(U.sheet.id); c.name = name; c.base = base; c.photo = U.tmpPhoto || null; }
    else { const c = { id: uid(), name, base, photo: U.tmpPhoto || null, created: Date.now() }; D.clients.push(c); }
    save(); U.sheet = null; U.tmpPhoto = undefined; render();
  } else if (f === "auth") {
    doAuth((e.submitter && e.submitter.value) || "in", String(fd.get("email") || "").trim(), String(fd.get("pw") || ""));
  } else if (f === "pin") {
    const p = String(fd.get("p") || ""); if (!/^\d{4}$/.test(p)) { toast("PIN must be 4 digits"); return; }
    D.pin = p; save(); toast("PIN changed"); e.target.reset();
  }
}
async function onChange(e) {

    try { U.tmpPhoto = await resizeImage(t.files[0]); const n = $("#cName"), b = $("#cBase"); const keep = { n: n.value, b: b.value }; render(); $("#cName").value = keep.n; $("#cBase").value = keep.b; }

/* ---------- cloud sync (Firebase) ---------- */
const FIREBASE_CONFIG = {"apiKey": "AIzaSyBcW9J2MF63KP2qi_ht2Q0YR62oYEhcoQE", "authDomain": "ak-abdullah-khalid.firebaseapp.com", "projectId": "ak-abdullah-khalid", "storageBucket": "ak-abdullah-khalid.firebasestorage.app", "messagingSenderId": "592111934204", "appId": "1:592111934204:web:bd106ee6673328a9159579"};
const FB_VER = "10.14.1";
const DEVICE = (() => { try { let d = localStorage.getItem("ak_device"); if (!d) { d = uid(); localStorage.setItem("ak_device", d); } return d; } catch (e) { return uid(); } })();
const S = { status: FIREBASE_CONFIG ? "signedout" : "off", user: null, fb: null, unsub: null, pushT: null, busy: false };
const STATUS_TXT = { off: "", signedout: "Cloud: not signed in", syncing: "Cloud: syncing…", synced: "Cloud: synced", offline: "Cloud: offline, will sync later", error: "Cloud: sync problem, retrying" };
const AUTH_MSG = { "auth/invalid-credential": "Wrong email or password", "auth/wrong-password": "Wrong email or password", "auth/user-not-found": "No account with this email", "auth/email-already-in-use": "This email already has an account, use Sign in", "auth/weak-password": "Password must be at least 6 characters", "auth/invalid-email": "That email is not valid", "auth/network-request-failed": "No internet connection", "auth/too-many-requests": "Too many attempts, try again later", "auth/operation-not-allowed": "Email/Password sign-in is not enabled in Firebase" };
const hashStr = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36) + "-" + s.length; };
function setStatus(st) { S.status = st; const c = $("#syncChip"); if (c) c.textContent = STATUS_TXT[st] || ""; }
async function fbLoad() {
  if (S.fb) return S.fb;
  const base = "https://www.gstatic.com/firebasejs/" + FB_VER + "/";
  const [A, Au, F] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
  const app = A.initializeApp(FIREBASE_CONFIG);
  S.fb = { A, Au, F, auth: Au.getAuth(app), db: F.getFirestore(app) };
  return S.fb;
}
const mainRef = () => S.fb.F.doc(S.fb.db, "users", S.user.uid, "sync", "main");
const photoRef = id => S.fb.F.doc(S.fb.db, "users", S.user.uid, "photos", id);
function buildPayload() {
  const o = JSON.parse(JSON.stringify(D)), photos = {};
  ["pin", "pending", "cloudUid", "syncedRev", "photoSynced", "updatedAt"].forEach(k => delete o[k]);
  o.clients.forEach(c => { if (c.photo) { const h = hashStr(c.photo); photos[c.id] = { h, data: c.photo }; c.photo = "@" + h; } });
  return { json: JSON.stringify(o), photos };
}
function schedulePush() { if (!S.user) return; clearTimeout(S.pushT); S.pushT = setTimeout(pushNow, 1200); }
function scheduleRetry() { clearTimeout(S.pushT); S.pushT = setTimeout(pushNow, 30000); }
async function pushNow() {
  if (!S.user || !S.fb || S.busy) return;
  if (D.cloudUid === S.user.uid && D.updatedAt <= D.syncedRev) return;
  S.busy = true; let failed = false; setStatus("syncing");
  try {
    const { json, photos } = buildPayload(), F = S.fb.F; D.photoSynced = D.photoSynced || {};
    for (const id of Object.keys(photos)) {
      if (D.photoSynced[id] !== photos[id].h) { await F.setDoc(photoRef(id), { data: photos[id].data, h: photos[id].h }); D.photoSynced[id] = photos[id].h; }
    }
    const rev = D.updatedAt;
    await F.setDoc(mainRef(), { rev, by: DEVICE, json });
    D.syncedRev = rev; D.cloudUid = S.user.uid; save({ remote: true }); setStatus("synced");
  } catch (e) { failed = true; setStatus(navigator.onLine === false ? "offline" : "error"); scheduleRetry(); }
  finally { S.busy = false; if (!failed && D.updatedAt > D.syncedRev) schedulePush(); }
}
function softRender() {
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { setTimeout(softRender, 2500); return; }
  render();
}
async function applyRemote(m, uidv) {
  const inc = JSON.parse(m.json), keep = { pin: D.pin, pending: D.pending };
  const have = {}; D.clients.forEach(c => { if (c.photo) have[hashStr(c.photo)] = c.photo; });
  const synced = {}, need = [];
  (inc.clients || []).forEach(c => {
    if (typeof c.photo === "string" && c.photo[0] === "@") {
      const h = c.photo.slice(1);
      if (have[h]) { c.photo = have[h]; synced[c.id] = h; } else need.push({ c, h });
    }
  });
  D = Object.assign(defaults(), inc, keep, { updatedAt: m.rev, syncedRev: m.rev, cloudUid: uidv, photoSynced: synced });
  for (const n of need) {
    try { const p = await S.fb.F.getDoc(photoRef(n.c.id)); if (p.exists()) { n.c.photo = p.data().data; D.photoSynced[n.c.id] = n.h; } else n.c.photo = null; }
    catch (e) { n.c.photo = null; }
  }

}
function detach() { if (S.unsub) { try { S.unsub(); } catch (e) {} S.unsub = null; } }
async function attach(u) {
  detach(); setStatus("syncing");
  try {
    const F = S.fb.F, snap = await F.getDoc(mainRef());
    if (!snap.exists()) { D.updatedAt = Math.max(D.updatedAt, Date.now()); D.syncedRev = 0; await pushNow(); }
    else {
      const m = snap.data(), first = D.cloudUid !== u.uid;
      if (first && D.clients.length && m.rev !== D.syncedRev) {
        const useCloud = confirm("This account already has data in the cloud.\n\nOK = load the cloud data here (replaces what is on this device).\nCancel = upload this device's data (replaces the cloud).");
        if (useCloud) await applyRemote(m, u.uid); else { D.updatedAt = Date.now(); D.syncedRev = 0; await pushNow(); }
      } else if (first || m.rev > D.updatedAt) await applyRemote(m, u.uid);
      else if (D.updatedAt > m.rev) { D.syncedRev = 0; await pushNow(); }
      else setStatus("synced");
    }
    S.unsub = F.onSnapshot(mainRef(), s => {
      if (!s.exists() || (s.metadata && s.metadata.hasPendingWrites)) return;
      const m = s.data(); if (m.by === DEVICE) return;
      if (m.rev > D.updatedAt) applyRemote(m, u.uid);
    }, () => setStatus("offline"));
  } catch (e) { setStatus(navigator.onLine === false ? "offline" : "error"); scheduleRetry(); }
  render();
}
async function syncInit() {
  if (!FIREBASE_CONFIG) return;
  try {
    const fb = await fbLoad();
    fb.Au.onAuthStateChanged(fb.auth, async u => {
      S.user = u || null;
      if (!u) { detach(); setStatus("signedout"); render(); return; }
      await attach(u);
    });
  } catch (e) { setStatus("offline"); }
}
async function doAuth(act, email, pw) {
  if (!email || !pw) { toast("Enter email and password"); return; }
  try {
    const fb = await fbLoad(); toast(act === "up" ? "Creating account…" : "Signing in…");
    if (act === "up") await fb.Au.createUserWithEmailAndPassword(fb.auth, email, pw);
    else await fb.Au.signInWithEmailAndPassword(fb.auth, email, pw);
  } catch (e) { toast(AUTH_MSG[e && e.code] || (navigator.onLine === false ? "No internet connection" : "Could not sign in")); }
}
async function doSignOut() {
  if (!confirm("Sign out? Your data stays on this device but stops syncing.")) return;
  try { const fb = await fbLoad(); detach(); await fb.Au.signOut(fb.auth); D.cloudUid = null; D.syncedRev = 0; save({ remote: true }); } catch (e) { toast("Could not sign out"); }
  render();
}
function cloudHTML() {
  if (!FIREBASE_CONFIG) return "";
  if (S.user) return `<label class="f">Cloud sync</label><div class="sum" style="margin-top:0"><div><span>Account</span><span style="direction:ltr">${esc(S.user.email || "")}</span></div><div><span>Status</span><span>${esc((STATUS_TXT[S.status] || "").replace("Cloud: ", ""))}</span></div></div>
    <div class="row mt wrap2"><button class="btn ghost sm" data-a="syncNow">Sync now</button><button class="btn danger sm" data-a="signOut">Sign out</button></div>
    <p class="hint">Anything you change on one device appears on your other devices that are signed in.</p><div class="sep"></div>`;
  return `<label class="f">Cloud sync</label>
    <form data-form="auth"><input name="email" type="email" inputmode="email" autocomplete="username" placeholder="Email" aria-label="Email" style="margin-bottom:8px"><input name="pw" type="password" autocomplete="current-password" placeholder="Password (6+ characters)" aria-label="Password">
    <div class="row mt wrap2"><button class="btn sm" type="submit" value="in">Sign in</button><button class="btn ghost sm" type="submit" value="up">Create account</button></div></form>
    <p class="hint">First device: Create account. Other devices: Sign in with the same email and password.</p><div class="sep"></div>`;
}
